name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permette di avviare la build manualmente da GitHub

jobs:
  build_ios:
    name: Build iOS App
    runs-on: macos-14 # Usa un'immagine macOS recente
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      # Compila il framework condiviso KMP per iOS
      - name: Build Shared Kotlin Framework
        run: ./gradlew :shared:linkDebugFrameworkIosArm64

      - name: Build iOS App (Unsigned/Ad-Hoc)
        run: |
          cd iosApp
          # Usiamo xcodebuild per creare un archivio senza firma di developer
          xcodebuild clean archive \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -archivePath $PWD/build/iosApp.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA payload
        run: |
          cd iosApp/build
          mkdir -p Payload
          # Sposta il file .app nell'archivio appena creato dentro la cartella Payload
          mv iosApp.xcarchive/Products/Applications/iosApp.app Payload/
          # Zippa la cartella Payload creando il file IPA
          zip -r ../../Checkly.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Checkly-iOS-App
          path: Checkly.ipa
